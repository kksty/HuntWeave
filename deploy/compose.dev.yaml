# Opt-in Compose Watch workflow. Base deployment remains immutable.
x-development: &development
  image: huntweave-control:dev
  build:
    target: development
  read_only: false

services:
  app:
    <<: *development
    develop:
      watch:
        - path: ../backend/src
          target: /opt/huntweave/backend/src
          action: sync+restart
          initial_sync: true
          ignore: ["**/__pycache__/**", "**/*.pyc"]
        - path: ../backend/migrations
          target: /opt/huntweave/backend/migrations
          action: sync+restart
          initial_sync: true
        - path: ../backend/pyproject.toml
          action: rebuild
        - path: ../backend/uv.lock
          action: rebuild
        - path: ./Dockerfile
          action: rebuild
        - path: ../frontend/src
          action: rebuild
        - path: ../frontend/index.html
          action: rebuild
        - path: ../frontend/package.json
          action: rebuild
        - path: ../frontend/package-lock.json
          action: rebuild
        - path: ../frontend/tsconfig.json
          action: rebuild
        - path: ../frontend/vite.config.ts
          action: rebuild
        - path: ../profiles/common-tcp-v1.json
          action: rebuild

  runner:
    <<: *development
    develop:
      watch:
        - path: ../backend/src
          target: /opt/huntweave/backend/src
          action: sync+restart
          initial_sync: true
          ignore: ["**/__pycache__/**", "**/*.pyc"]
        - path: ../backend/pyproject.toml
          action: rebuild
        - path: ../backend/uv.lock
          action: rebuild
        - path: ./Dockerfile
          action: rebuild
