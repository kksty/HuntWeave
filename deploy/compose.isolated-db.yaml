# Publishes the Compose PostgreSQL on a loopback port, for backend checks and the concurrency
# fixture that need a database of their own.
#
# **This file is a deliberate act, not a convenience.** Adding `-f deploy/compose.isolated-db.yaml`
# to a command run against the daily `huntweave` project would publish that project's live database
# on the host, so the port has no default: `HUNTWEAVE_ISOLATED_DB_PORT` must be set explicitly and
# Compose refuses to start without it. Set it, name a disposable project, and start only `postgres`:
#
#   $env:HUNTWEAVE_ISOLATED_DB_PORT = "18400"    # confirm it is free first
#   docker compose --project-name huntweave-i21-concurrency `
#     -f deploy/compose.yaml -f deploy/compose.isolated-db.yaml up -d --wait postgres
#
# The project prefix on `postgres_data` is what keeps such a run's rows out of the daily project.
# The control image is not rebuilt for this: the checks here drive the services directly. Tear the
# run down with the same project name (`down -v`), and never with the daily one.
#
# `database` is `internal: true` in the base file, and a published port cannot be wired on an
# internal-only network (the binding lands in `HostConfig.PortBindings` while `NetworkSettings.Ports`
# stays empty). The extra `isolated` network is what makes the loopback binding real; it carries no
# services of its own and exists only so the host can reach this one container.
services:
  postgres:
    ports: ["127.0.0.1:${HUNTWEAVE_ISOLATED_DB_PORT:?set HUNTWEAVE_ISOLATED_DB_PORT to a free loopback port, and name a disposable project}:5432"]
    networks: [database, isolated]

networks:
  isolated: {}
